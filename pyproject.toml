[project]
name = "hud-ops-diagnostics"
version = "0.1.0"
description = "Hierarchical ops diagnostics agent with Sentry, Supabase, Railway, and kubectl subagents"
requires-python = ">=3.11"
dependencies = [
    "hud-python[agents]",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
hud-python = { git = "https://github.com/hud-ai/hud-sdk", branch = "feat/scenario-improvements" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environments"]
include = ["orchestrator.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

